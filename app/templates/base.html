<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tiny Market{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="container nav">
        <a class="brand" href="{{ url_for('products.index') }}">Tiny Market</a>
        <nav>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('products.create') }}">상품 등록</a>
                <a href="{{ url_for('products.mypage') }}">마이페이지</a>
                <form class="inline" method="post" action="{{ url_for('auth.logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="link-button" type="submit">로그아웃</button>
                </form>
            {% else %}
                <a href="{{ url_for('auth.login') }}">로그인</a>
                <a href="{{ url_for('auth.register') }}">회원가입</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<footer class="container footer">
    <p>Flask 기반 교육용 중고거래 플랫폼</p>
</footer>
</body>
</html>
